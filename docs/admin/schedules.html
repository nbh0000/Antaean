<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>시간표 | ANTAEAN 관리자</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" href="../assets/img/brand/antaean-emblem.png">
    <link rel="stylesheet" href="../assets/css/admin.css">
  </head>
  <body>
    <div class="a-wrap">
      <nav class="a-side"></nav>
      <main class="a-main">
        <div class="a-head">
          <h1>시간표</h1>
          <p>지점별 수업 시간표입니다. 요일과 반은 여러 개를 함께 고를 수 있습니다.</p>
        </div>
        <div class="card">
          <div class="actions" style="margin-bottom:12px">
            <button class="btn btn-line btn-sm" data-b="songdo">송도점</button>
            <button class="btn btn-line btn-sm" data-b="baegot">배곧점</button>
            <span style="flex:1"></span>
            <button class="btn btn-primary btn-sm" id="add">줄 추가</button>
          </div>
          <p class="hint" style="margin:0 0 12px">
            요일과 반은 여러 개를 함께 고를 수 있습니다.
            (예: 월·수·금 16:00~17:00 에 취미반 + 꿈나무반)
          </p>
          <div style="overflow-x:auto">
            <table>
              <thead><tr>
                <th style="min-width:210px">요일</th>
                <th style="min-width:170px">시간</th>
                <th style="min-width:230px">반</th>
                <th style="min-width:140px">비고</th>
                <th style="width:72px">순서</th>
                <th style="width:70px"></th>
              </tr></thead>
              <tbody id="rows"></tbody>
            </table>
          </div>
          <div class="actions" style="margin-top:14px">
            <button class="btn btn-primary" id="save">전체 저장</button>
          </div>
        </div>
      </main>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.58.0/dist/umd/supabase.min.js"></script>
    <script src="../assets/js/config.js"></script>
    <script src="../assets/js/db.js"></script>
    <script src="../assets/js/admin.js"></script>
    <script>
      (async function () {
        if (!(await Admin.guard("schedules"))) return;
        var DAYS = ["월", "화", "수", "목", "금", "토", "일"];
        var branch = "songdo", progs = [], rows = [];
        progs = await AF.list("programs", function (q) { return q.order("sort"); });

        function chips(name, list, chosen, key) {
          return '<div class="chips">' + list.map(function (o) {
            var v = o.v === undefined ? o : o.v;
            var t = o.t === undefined ? o : o.t;
            var on = (chosen || []).indexOf(v) >= 0;
            return '<label class="chip"><input type="checkbox" data-' + key + '="' + AF.esc(v) + '"' +
              (on ? " checked" : "") + "> " + AF.esc(t) + "</label>";
          }).join("") + "</div>";
        }

        function draw() {
          document.querySelectorAll("[data-b]").forEach(function (b) {
            b.classList.toggle("btn-primary", b.dataset.b === branch);
            b.classList.toggle("btn-line", b.dataset.b !== branch);
          });
          var tb = document.getElementById("rows");
          if (!rows.length) {
            tb.innerHTML = '<tr><td colspan="6" class="empty">등록된 시간표가 없습니다. \'줄 추가\'를 눌러 입력하세요.</td></tr>';
            return;
          }
          tb.innerHTML = rows.map(function (r, i) {
            return '<tr data-i="' + i + '">' +
              "<td>" + chips("days", DAYS, r.days || [], "day") + "</td>" +
              '<td><div class="time-pair">' +
                '<input data-k="start_time" type="time" step="60" value="' + AF.esc(r.start_time || "") + '">' +
                "<span>~</span>" +
                '<input data-k="end_time" type="time" step="60" value="' + AF.esc(r.end_time || "") + '">' +
              "</div></td>" +
              "<td>" + chips("progs", progs.map(function (p) { return { v: p.id, t: p.name }; }), r.program_ids || [], "prog") + "</td>" +
              '<td><input data-k="note" type="text" value="' + AF.esc(r.note || "") + '"></td>' +
              '<td><input data-k="sort" type="text" inputmode="numeric" value="' + (r.sort || 0) + '"></td>' +
              '<td class="rt"><button class="btn btn-danger btn-sm" data-del="' + i + '">삭제</button></td></tr>';
          }).join("");
        }

        async function load() {
          rows = await AF.list("schedules", function (q) {
            return q.eq("branch_id", branch).order("sort");
          });
          draw();
        }

        function collect() {
          document.querySelectorAll("#rows tr[data-i]").forEach(function (tr) {
            var r = rows[+tr.dataset.i];
            if (!r) return;
            tr.querySelectorAll("[data-k]").forEach(function (el) {
              r[el.dataset.k] = el.dataset.k === "sort" ? (parseInt(el.value, 10) || 0) : el.value;
            });
            r.days = Array.prototype.map.call(
              tr.querySelectorAll("[data-day]:checked"), function (el) { return el.dataset.day; });
            r.program_ids = Array.prototype.map.call(
              tr.querySelectorAll("[data-prog]:checked"), function (el) { return el.dataset.prog; });
          });
        }

        document.addEventListener("click", async function (e) {
          var b = e.target.closest("[data-b]");
          if (b) { collect(); branch = b.dataset.b; await load(); return; }

          if (e.target.id === "add") {
            collect();
            rows.push({
              branch_id: branch, days: [], program_ids: [],
              start_time: "", end_time: "", note: "", sort: rows.length
            });
            draw();
            return;
          }

          var d = e.target.closest("[data-del]");
          if (d) {
            var i = +d.dataset.del, r = rows[i];
            if (r.id && !(await Admin.remove("schedules", r.id, "이 줄"))) return;
            collect();
            rows.splice(i, 1);
            draw();
            return;
          }

          if (e.target.id === "save") {
            collect();
            var bad = rows.filter(function (r) { return !r.start_time || !r.end_time; });
            if (bad.length) { Admin.toast("시작·종료 시각이 비어 있는 줄이 있습니다.", true); return; }
            var noDay = rows.filter(function (r) { return !r.days.length; });
            if (noDay.length) { Admin.toast("요일을 고르지 않은 줄이 있습니다.", true); return; }

            for (var i = 0; i < rows.length; i++) {
              var r = rows[i];
              r.branch_id = branch;
              /* 예전 단일 컬럼도 함께 채워 두어 이전 데이터와 섞여도 깨지지 않게 한다 */
              r.day = r.days[0] || null;
              r.program_id = null;
              r.time_range = r.start_time + "-" + r.end_time;
              await Admin.save("schedules", r, { message: "" });
            }
            Admin.toast("시간표를 저장했습니다.");
            load();
          }
        });

        load();
      })();
    </script>
  </body>
</html>
