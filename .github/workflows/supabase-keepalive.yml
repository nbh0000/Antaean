name: Supabase keep-alive

# 무료 프로젝트는 7일간 요청이 없으면 일시정지된다.
# 하루 한 번 가벼운 조회를 보내 깨어 있게 한다.
# 여기 쓰는 URL·anon 키는 홈페이지(assets/js/config.js)에 이미 공개된 값이라
# 시크릿으로 숨길 필요가 없다. 실제 권한은 Supabase RLS 가 막는다.
on:
  schedule:
    - cron: "30 21 * * *" # 매일 06:30 (한국시간)
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: 조회 한 건 보내기
        run: |
          URL="https://djfosgwhhxpyvkhpbxjh.supabase.co"
          KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRqZm9zZ3doaHhweXZraHBieGpoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgyNjgyNDQsImV4cCI6MjEwMzg0NDI0NH0.pk7i3dLjFgh9oRFylAmECJ1zSK5bgZ_J8JFIe4dRzB0"
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY" \
            "$URL/rest/v1/branches?select=id&limit=1")
          echo "HTTP $code"
          test "$code" = "200"
