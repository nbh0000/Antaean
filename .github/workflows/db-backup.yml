name: DB 백업

# Supabase 무료 플랜에는 자동 백업이 없어서 여기서 매일 받아 둔다.
# 결과물은 Actions 실행 기록의 Artifact 로 30일간 보관된다.
on:
  schedule:
    - cron: "0 18 * * *" # 매일 03:00 (한국시간)
  workflow_dispatch: # 필요할 때 손으로 실행

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - name: pg_dump 실행
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$DB_URL" ]; then
            echo "SUPABASE_DB_URL 시크릿이 없습니다. 저장소 Settings > Secrets 에 등록하세요."
            exit 1
          fi
          # 서버와 버전을 맞추기 위해 컨테이너의 pg_dump 를 쓴다
          docker run --rm -v "$PWD:/out" -e DB_URL postgres:17-alpine \
            pg_dump "$DB_URL" \
              --schema=public --no-owner --no-privileges \
              -Fc -f /out/antaean-public.dump
          ls -lh antaean-public.dump

      - name: Artifact 로 보관
        uses: actions/upload-artifact@v4
        with:
          name: antaean-db-${{ github.run_number }}
          path: antaean-public.dump
          retention-days: 30
